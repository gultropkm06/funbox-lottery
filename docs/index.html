<script>
(function(){

var onlyTodo = !!load('onlyTodo', false);

  return '<div class="row' + (done ? ' done' : '') + (l.gone ? ' gone' : '') + '" data-url="' + esc(l.url) + '">' +
    '<a href="' + esc(l.url) + '" target="_blank" rel="noopener" data-url="' + esc(l.url) + '"><span class="txt"><span class="store">' + esc(l.branch) + '</span><span class="meta">' + chips + '</span></span><span class="go">›</span></a>' +
    '<button type="button" class="mark" data-url="' + esc(l.url) + '" aria-label="' + (done ? '取消記號' : '標記已點') + '">' + (done ? '✓' : '○') + '</button></div>';
}
function renderPending(){
  var html = '<div class="hint">還沒有品項連結的店，依地區 → 縣市排列。橘色 = 已發 9/24 公告但連結還沒放；紫色 = 貼文說連結會放在 VOOM 或留言區。</div>';
  D.regions.forEach(function(r){
    var ps = D.pending.filter(function(p){ return p.region === r.key; });
    if (!ps.length) return;
    var byCity = {}, order = [];
    ps.forEach(function(p){ if (!byCity[p.city]) { byCity[p.city] = []; order.push(p.city); } byCity[p.city].push(p); });
    order.sort(function(a, b){ return (cityRank[a] == null ? 99 : cityRank[a]) - (cityRank[b] == null ? 99 : cityRank[b]); });
    html += '<section class="rgn"><h2>' + r.label + '<small class="mono">' + ps.length + ' 家</small></h2>' + order.map(function(c){
      return '<div class="cityblk"><div class="ch">' + esc(c) + '</div>' + byCity[c].map(function(p){
        return '<div class="prow"><span class="nm">' + esc(p.branch) + '</span>' + (p.where ? '<span class="chip where">' + esc(p.where) + '</span>' : '') +
          '<span class="chip ' + (p.kind === 'announced' ? 'ann' : 'none') + '">' + (p.kind === 'announced' ? '已公告' : '未發文') + '</span><span class="id mono">' + esc(p.line) + '</span></div>';
      }).join('') + '</div>';
    }).join('') + '</section>';
  });
  if (!D.pending.length) html += '<div class="empty">所有分店都已有連結 🎉</div>';
  $('main').innerHTML = html;
}
function renderMain(){
  if (tab === 'pending') return renderPending();
  var ls = linksFor(tab).slice().sort(sortLinks);
  var shown = onlyTodo ? ls.filter(function(l){ return !clicked[l.url]; }) : ls;
  var html = '<div class="hint">' + (tab === 'new' ? D.cutoff + ' 開抽之後才補上的連結集中在這裡；「新1」= 開抽後第 1 次補抓抓到、「新2」= 第 2 次…。地區分頁裡它們排在各品項群組的最後面。' : '點一列開啟 LINE 抽選畫面並自動做記號；右側 ○ / ✓ 可手動切換。11:00 後補上的連結會排在各品項群組最後面並標「新N」。') + '</div>';
  if (!shown.length) {
    html += '<div class="empty">' + (ls.length ? '這個分頁的連結都點過了 🎉' : (tab === 'new' ? '目前沒有 ' + D.cutoff + ' 後新補上的連結' : '這個地區還沒有任何連結')) + '</div>';
  } else {
    var groups = [], map = {};
    shown.forEach(function(l){ var k = l.key || l.item; if (!map[k]) { map[k] = { key: k, item: l.item, rank: l.rank, rows: [] }; groups.push(map[k]); } map[k].rows.push(l); });
    html += groups.map(function(g){
      var parts = splitName(g.item), allRows = ls.filter(function(l){ return (l.key || l.item) === g.key; }), left = todo(allRows);
      return '<section class="group"><div class="ghead"><span class="rank mono' + (g.rank >= 999 ? ' none' : '') + '">' + (g.rank >= 999 ? '—' : g.rank) + '</span>' +
        '<span class="gname">' + (parts[0] ? '<span class="code mono">' + esc(parts[0]) + '</span>' : '') + esc(parts[1]) + '</span>' +
        '<span class="gcount mono">未點 <b>' + left + '</b>/' + allRows.length + '</span></div>' + g.rows.map(rowHtml).join('') + '</section>';
    }).join('');
  }
  $('main').innerHTML = html;
}
function render(){ renderHeader(); renderMain(); }
function setDone(url, on){ if (on) clicked[url] = Date.now(); else delete clicked[url]; save('clicked', clicked);
  document.querySelectorAll('.row[data-url="' + url.replace(/"/g, '\\"') + '"]').forEach(function(row){ row.classList.toggle('done', on); var m = row.querySelector('.mark'); m.textContent = on ? '✓' : '○'; });
  renderHeader();
  document.querySelectorAll('.group').forEach(function(sec){ var rows = sec.querySelectorAll('.row'); var left = 0; rows.forEach(function(r){ if (!r.classList.contains('done')) left++; }); var b = sec.querySelector('.gcount b'); if (b) b.textContent = left; });
  if (onlyTodo && on) { setTimeout(renderMain, 350); }
}
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; save('tab', tab); try { history.replaceState(null, '', '#' + tab); } catch(err){} render(); window.scrollTo(0, 0); return; }
  var a = e.target.closest('.row a[data-url]'); if (a) { setDone(a.dataset.url, true); return; }  // 不阻止預設：讓連結正常開新分頁
  var m = e.target.closest('.mark[data-url]'); if (m) { var row = m.closest('.row'); setDone(m.dataset.url, !row.classList.contains('done')); return; }
  if (e.target.id === 'reset') { var b = e.target; if (b.dataset.arm) { clicked = {}; save('clicked', clicked); delete b.dataset.arm; b.textContent = '重設所有記號'; render(); toast('記號已清除'); } else { b.dataset.arm = '1'; b.textContent = '確定要清除全部記號？再按一次'; setTimeout(function(){ delete b.dataset.arm; b.textContent = '重設所有記號'; }, 3000); } return; }
});
$('onlyTodo').checked = onlyTodo;
$('onlyTodo').addEventListener('change', function(){ onlyTodo = this.checked; save('onlyTodo', onlyTodo); renderMain(); });
render();
})();
</script>
